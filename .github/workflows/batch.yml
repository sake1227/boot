name: batch-boot

# 机型表 → 发现各版本直链 → matrix 并发 → 提取 boot → 按「分类/机型中文名/版本.zip」上传 123
#
# 部署：把本文件放 .github/workflows/batch.yml，
#       devices.json / discover.py / extract_one.sh 放仓库根。
# 需要的 secret：RCLONE_CONF、UNZIP_PASSWORD

on:
  workflow_dispatch:
    inputs:
      only:
        description: '机型：填中文名或代号，可逗号分隔（如「一加15」「小米18」「dada」），留空=全部'
        default: ''
      brand:
        description: '品牌（下拉选；选「全部」= 不限品牌）'
        type: choice
        default: 全部
        options:
          - 全部
          - 小米
          - 红米
          - 一加
          - OPPO
          - 真我
          - 魅族
          - Google
          - 三星
          - 摩托罗拉
      max_new_per_device:
        description: '每个机型本次最多入队几个新版本'
        default: '1'
      dry_run:
        description: '只发现链接、不下载提取'
        type: boolean
        default: false
      reset_seen:
        description: '清空去重表（失败的运行会误标记已处理，卡住进度时勾这个）'
        type: boolean
        default: false
      reconcile:
        description: '对账模式：扫全部版本，只补网盘上缺的（每 3 天自动跑一次这个）'
        type: boolean
        default: false
      max_parallel:
        description: '并发数（免费账号上限 20）'
        default: '10'
      max_total:
        description: '本次最多派发多少个包（留空用默认 12；全量重提填 200）'
        default: ''
  schedule:
    # 每天 UTC 18:00 = 北京 02:00 —— 增量：每个机型推 1 个新版本
    - cron: '0 18 * * *'
    # 每 3 天 UTC 20:00 = 北京 04:00 —— 对账：扫全部版本，只补网盘上没有的
    - cron: '0 20 */3 * *'

concurrency:
  group: batch-boot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # 1. 发现：扫机型表，产出待提取清单
  # ---------------------------------------------------------------------------
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
      count: ${{ steps.find.outputs.count }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 恢复去重表与详情页缓存
        uses: actions/cache@v6
        with:
          path: |
            state/seen.json
            state/cache
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: 安装 rclone（要列网盘清单，判断哪些已上传）
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: 配置 rclone
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone
          if [ -n "${RCLONE_CONF:-}" ]; then
            printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          elif [ -f rclone.zip ]; then
            unzip -o -q rclone.zip -d ~/.config/rclone/
          else
            echo "缺少 rclone 配置"; exit 1
          fi

      - name: 拉网盘现有清单
        env:
          RCLONE_DEST: ${{ vars.RCLONE_DEST || '123:zanfang' }}
        run: |
          set -euo pipefail
          mkdir -p out
          rclone lsf "$RCLONE_DEST" -R --files-only --format pst > out/remote.txt || true
          echo "网盘现有文件数: $(wc -l < out/remote.txt)"

      - name: 发现直链
        id: find
        env:
          ONLY: ${{ inputs.only }}
          BRAND: ${{ inputs.brand }}
          BRANDCN: ${{ inputs.brand }}
          MAXNEW: ${{ inputs.max_new_per_device }}
          RESET_SEEN: ${{ inputs.reset_seen }}
          RECONCILE: ${{ inputs.reconcile || github.event.schedule == '0 20 */3 * *' }}
          RECONCILE_MAX: ${{ vars.RECONCILE_MAX || '12' }}
          MAX_TOTAL: ${{ inputs.max_total || vars.MAX_TOTAL || '12' }}
        run: |
          set -euo pipefail
          mkdir -p out state
          if [ "${RESET_SEEN:-false}" = "true" ]; then
            echo "清空去重表 state/seen.json"
            rm -f state/seen.json
          fi
          ARGS=(--devices devices.json --state state/seen.json
                --out out/candidates.json --matrix-out out/matrix.json
                --print)
          if [ "${RECONCILE:-false}" = "true" ]; then
            echo "== 对账模式：扫全部版本，只补网盘上缺的 =="
            ARGS+=(--all-versions --existing out/remote.txt --max-new-per-device 50 --max-total "${MAX_TOTAL:-12}")
          else
            ARGS+=(--new-only --existing out/remote.txt --max-new-per-device "${MAXNEW:-1}" --max-total "${MAX_TOTAL:-12}")
          fi
          if [ -n "${ONLY:-}" ];  then ARGS+=(--only "$ONLY");  fi
          if [ -n "${BRAND:-}" ]; then ARGS+=(--brandcn "$BRAND"); fi

          python discover.py "${ARGS[@]}"

          M=$(cat out/matrix.json 2>/dev/null || echo '{"include":[]}')
          echo "matrix=$M" >> "$GITHUB_OUTPUT"
          echo "count=$(printf '%s' "$M" | python -c 'import json,sys;print(len(json.load(sys.stdin)["include"]))')" >> "$GITHUB_OUTPUT"

      - name: 摘要
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("out/matrix.json")
          if not p.exists():
              print("### 发现阶段失败，没有产出 matrix"); raise SystemExit
          m = json.loads(p.read_text("utf-8"))
          inc = m.get("include", [])
          print(f"### 本次待提取 {len(inc)} 个包\n")
          if inc:
              print("| 品牌 | 机型 | 版本 | 文件名 |")
              print("|---|---|---|---|")
              for i in inc[:60]:
                  print(f"| {i['brand']} | {i['model']} | {i['version']} | {i['name'][:70]} |")
          c = pathlib.Path("out/candidates.json")
          if c.exists():
              items = json.loads(c.read_text("utf-8")).get("items", [])
              hold = [x for x in items if x["status"] != "ready"]
              if hold:
                  print(f"\n**{len(hold)} 条需二次解析**（未派发）：")
                  for x in hold[:20]:
                      print(f"- `{x['device_id']}` {x['version']} → {x['requires']}")
          PY

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: candidates
          path: |
            out/candidates.json
            out/matrix.json
            state/seen.json
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 2. 提取：一个包一个 job
  # ---------------------------------------------------------------------------
  farm:
    needs: discover
    if: ${{ !inputs.dry_run && needs.discover.outputs.count != '0' && needs.discover.outputs.count != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      # 远程提取后单个 job 只要 1~3 分钟，可开到 10~20
      # GitHub 免费账号并发上限 20；123 上传并发太高会被限速
      max-parallel: ${{ fromJSON(inputs.max_parallel || '10') }}
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 腾磁盘（14G → ~30G，8G 的包全靠这一步）
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/share/swift || true
          sudo apt-get clean
          df -h /

      - name: 装工具
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 p7zip-full unzip curl lz4 python3-pip
          curl -fsSL https://rclone.org/install.sh | sudo bash
          # 支持「URL 直接提取、只拉需要的分片」的 fork
          python3 -m pip install --upgrade "git+https://github.com/5ec1cff/payload-dumper"
          payload_dumper --help | head -5 || true

      - name: 配置 rclone
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone
          if [ -n "${RCLONE_CONF:-}" ]; then
            printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          elif [ -f rclone.zip ]; then
            unzip -o -q rclone.zip -d ~/.config/rclone/
          else
            echo "缺少 rclone 配置（secret RCLONE_CONF 或仓库根的 rclone.zip）"
            exit 1
          fi
          rclone lsd 123: >/dev/null && echo "rclone 就绪"

      - name: 准备欧加（OPPO/一加/realme）解析工具
        if: matrix.resolve != ''
        run: |
          set -euo pipefail
          # 必须用同一个解释器安装，否则 tomboy_pro.py 里 import 会失败
          python3 -m pip install --quiet --upgrade requests cryptography
          python3 -c "import requests, cryptography; print('deps ok')"

          rm -rf tools/oplus
          git clone --depth 1 https://github.com/JerryTse-OSS/OPlus-Tracker tools/oplus

          # 显式校验：文件在、且能 import 自己的 config（别让 --help 静默失败）
          test -f tools/oplus/tomboy_pro.py || { echo "tomboy_pro.py 没 clone 下来"; exit 1; }
          ( cd tools/oplus && python3 -c "import config; print('config ok')" )
          ls -l tools/oplus/tomboy_pro.py

      - name: 提取并上传
        env:
          ROM_URL: ${{ matrix.url }}
          ROM_NAME: ${{ matrix.name }}
          RESOLVE_CMD: ${{ matrix.resolve }}
          BRAND: ${{ matrix.brand }}
          MODEL: ${{ matrix.model }}
          BRANDCN: ${{ matrix.brandcn }}
          CAT: ${{ matrix.cat }}
          DEVNAME: ${{ matrix.devname }}
          REFERER: ${{ matrix.referer }}
          TARGETS: ${{ matrix.targets }}
          OPTIONAL: ${{ matrix.optional }}
          VERSION: ${{ matrix.version }}
          UNZIP_PASSWORD: ${{ secrets.UNZIP_PASSWORD }}
          PASSFILE: ${{ github.workspace }}/获取解压密码.txt
          RCLONE_DEST: ${{ vars.RCLONE_DEST || '123:zanfang' }}
        run: |
          chmod +x extract_one.sh
          ./extract_one.sh

      - name: 失败留痕
        if: failure()
        run: |
          {
            echo "### 失败: ${{ matrix.brand }}/${{ matrix.model }} ${{ matrix.version }}"
            echo ""
            echo "- 文件: \`${{ matrix.name }}\`"
            echo "- 链接: ${{ matrix.url }}"
            echo "- 重跑: Actions → batch-boot → Run workflow，only=\`${{ matrix.id }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

